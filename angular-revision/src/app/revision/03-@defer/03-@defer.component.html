 <!-- 
    Triggers
      idle - when browser is idle
      viewport - when view is visible
      interaction - when interaction is performed on the screen
      hover - when mouse enters the view area
      ⚠️ interaction / hover / viewport with no reference watch the @placeholder, not the screen (Gotcha 2)
      immediate - after parent finished rendering
      timer(2s) - after the timer mentioned time
      when <condition> - when condition met
 -->

<!-- ⚠️ `when` is one-way: the second Toggle doesn't hide the chart (Gotcha 1) -->
@defer (when isVisible) {
  <app-heavy-chart />
}@placeholder {
  <p>Placeholder</p>
} @loading(after 100ms; minimum 1s) {
  <p>Loading...</p>
