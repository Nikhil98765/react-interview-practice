<!-- ** For
        $index - index
        $last  - boolean; true for last element
        $count - length of the iterable
        $odd   - boolean; true for odd index
        $even  - boolean; true for even index
        @empty - if items in the iterable is o, fallback

        * Track - older syntax uses trackBy: which accepts a function which gets index, item now we can directly assign a property of item to it.
                  Don't use $index because if element got added/removed or reorder between list items, rebinding happens to nodes from position where it got added and DOM state stay put on the wrong data node which will cause to bug.
                  without track in old syntax, used to check by object reference with ===
 -->

<!-- ** Exercise -->

<!-- Add uses a fixed id 43 on purpose: the second click duplicates the track key -> NG0955 (Gotcha 3) -->
<button (click)="orders.update(prev => [...prev,{id: 43, status: 'delivered', note: 'order delivered'}])">Add</button>
<button (click)="orders.set(orders().slice(1))">Remove first</button>
<button (click)="orders.set([...orders()].reverse())">Shuffle</button>

<ul>
  @for(item of orders(); track item.id) {
    <li>
      <!-- {{item.status}} - {{item.note}} => {{$count}} {{$last ? '(latest)' : ''}}
      <input type="text"> -->
      @switch (item.status) {
        @case ('shipped') {
          <span>shipped</span>
        }
        @case('pending') {
          <span>pending</span>
        }
        @default {
          <span>{{item.status}}</span>
        }
      }
    </li>
  }
</ul>

@if(selected(); as s) {
  <span>{{s.id}}</span>
} @else {
  <p>none selected</p>
}
